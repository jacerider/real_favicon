real_favicon.real_favicon.*:
  type: config_entity
  label: 'Favicon config'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string
    tags:
      type: sequence
      label: 'Tags'
      sequence:
        type: string
    archive:
      type: sequence
      label: 'Archive'
      sequence:
        type: string

real_favicon.settings:
  type: config_object
  label: 'Favicon settings'
  mapping:
    themes:
      type: sequence
      label: 'Favicon per theme'
      sequence:
        type: string
        label: 'Favicon ID'
